<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MDM TATA - Inicio de Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {

            margin: 0;
            height: 100vh;

            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Segoe UI', sans-serif;

        }

        .login-card {

            width: 430px;

            border: none;

            border-radius: 18px;

            overflow: hidden;

            box-shadow: 0 12px 35px rgba(0, 0, 0, .15);

        }

        .login-header {

            background: #011983;

            color: white;

            padding: 22px 30px;

            text-align: center;

        }

        .login-header i {

            font-size: 42px;

        }

        .login-header h3 {

            margin-top: 10px;
            margin-bottom: 2px;

            font-weight: 700;

            font-size: 2rem;

        }

        .login-header p {

            margin: 0;

            font-size: .95rem;

            opacity: .9;

        }

        .login-body {

            padding: 28px;

        }

        .btn-login {

            background: #011983;

            border-color: #011983;

        }

        .form-label {

            font-weight: 600;

        }

        .btn-login {

            width: 100%;
            height: 48px;

            font-weight: bold;

        }

        #mensajeError {

            display: none;

        }

        .footer-login {

            text-align: center;

            color: #6c757d;

            font-size: .85rem;

            margin-top: 25px;

        }
    </style>

</head>

<body>

    <div class="card login-card">

        <div class="login-header">

            <i class="bi bi-shield-lock-fill"></i>

            <h3>

                TATA MDM

            </h3>

            <p>

                Mobile Device Management

            </p>

        </div>

        <div class="login-body">

            <div class="alert alert-danger" id="mensajeError">

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Usuario

                </label>

                <input type="text" id="txtUsuario" class="form-control form-control-lg" autocomplete="username">

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Contraseña

                </label>

                <input type="password" id="txtPassword" class="form-control form-control-lg"
                    autocomplete="current-password">

            </div>

            <button class="btn btn-login" id="btnLogin" style="background:#011983;border-color:#011983;color:white;">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Iniciar Sesión

            </button>

            <div class="footer-login">

                Sistema Corporativo TATA<br>

                © 2026 TATA

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
