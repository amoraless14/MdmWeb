<style>
#modalHistorialCargador .modal-title {
    font-weight: 700;
}

#modalHistorialCargador .form-label {
    font-weight: 700;
}

#modalHistorialCargador .table thead th {
    font-weight: 700;
    position: sticky;
    top: 0;
    background: #f8f9fa;
    z-index: 2;
}

#modalHistorialCargador .table tbody td {
    font-weight: 600;
}

#modalHistorialCargador .btn {
    font-weight: 700;
}

#modalHistorialCargador .table-responsive {
    max-height: 280px;
    overflow-y: auto;
}
    
</style>
<div class="modal fade" id="modalHistorialCargador" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-clock-history me-2"></i>
                    Historial de desconexiones
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">

                <div class="row g-3 align-items-end mb-4">

                    <div class="col-md-4">
                        <label class="form-label">Desde</label>
                        <input type="date" class="form-control" id="fechaDesde">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Hasta</label>
                        <input type="date" class="form-control" id="fechaHasta">
                    </div>

                    <div class="col-md-4">
                        <button type="button" class="btn btn-primary w-100" id="btnBuscarHistorial">
                            <i class="bi bi-search me-1"></i>
                            Buscar
                        </button>
                    </div>

                </div>

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">
                            <tr>
                                <th>Fecha y hora</th>
                                <th>Estado</th>
                                <th>Batería</th>
                            </tr>
                        </thead>

                        <tbody id="tablaHistorialCargador">
                            <tr>
                                <td colspan="3" class="text-center text-muted py-4">
                                    Sin registros
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cerrar
                </button>

            </div>

        </div>

    </div>

</div>
