<style>
    #modalUsuario .modal-dialog {

        max-width: 650px;
        margin: auto;

    }

    #modalUsuario .modal-content {

        border-radius: 12px;
        overflow: hidden;

    }

    #modalUsuario .modal-header {

        padding: 14px 18px;

    }

    #modalUsuario .modal-body {

        padding: 20px;

    }

    #modalUsuario .modal-footer {

        padding: 14px 18px;

    }

    #modalUsuario .form-control,
    #modalUsuario .form-select {

        height: 40px;

    }

    #modalUsuario .form-label {

        font-weight: 600;
        margin-bottom: 6px;

    }
</style>


<div class="container-fluid py-3">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="mb-0">
            <i class="bi bi-people-fill"></i>
            Usuarios
        </h5>

        <button class="btn btn-primary" id="btnNuevoUsuario" onclick="abrirModalUsuario()">

            <i class="bi bi-plus-circle"></i>

            Nuevo Usuario

        </button>

    </div>

    <div class="card shadow-sm">

        <div class="card-body p-0">

            <table class="table table-hover mb-0 align-middle">

                <thead class="table-light">

                    <tr>

                        <th>Usuario</th>

                        <th>Nombre</th>

                        <th>Rol</th>

                        <th>Estado</th>

                        <th>Creado</th>

                        <th>Última Modificación</th>

                        <th class="text-end">Acciones</th>

                    </tr>

                </thead>

                <tbody id="tablaUsuarios">

                    <tr>

                        <td colspan="7" class="text-center py-5 text-muted">

                            Cargando usuarios...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>



<!-- ================= MODAL ================= -->

<div class="modal fade" id="modalUsuario" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="tituloModalUsuario">

                    Nuevo Usuario

                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input type="hidden" id="usuarioId">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Usuario

                        </label>

                        <input type="text" class="form-control" id="txtUsuarioSistema">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Nombre

                        </label>

                        <input type="text" class="form-control" id="txtNombreUsuario">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Contraseña

                        </label>

                        <input type="password" class="form-control" id="txtPasswordUsuario">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Rol

                        </label>

                        <select class="form-select" id="cmbRolUsuario">

                            <option value="ADMIN">

                                Administrador

                            </option>

                            <option value="TECNICO">

                                Técnico

                            </option>

                        </select>

                    </div>

                    <div class="col-12">

                        <div class="form-check form-switch">

                            <input class="form-check-input" type="checkbox" id="chkUsuarioActivo" checked>

                            <label class="form-check-label" for="chkUsuarioActivo">

                                Usuario Activo

                            </label>

                        </div>

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button class="btn btn-primary" id="btnGuardarUsuario">

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>
